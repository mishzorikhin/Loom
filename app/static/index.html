<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loom</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Geologica:wght@500;600;700;800&family=Literata:opsz,wght@7..72,520;7..72,680&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
  <header class="hud">
    <section class="isle isle-clock" aria-label="Время">
      <p class="brand"><svg class="logo" viewBox="0 0 32 32" aria-hidden="true"><path d="M4 9c4-3 8-3 12 0s8 3 12 0M4 16c4-3 8-3 12 0s8 3 12 0M4 23c4-3 8-3 12 0s8 3 12 0" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"/></svg><span id="place">Loom</span></p>
      <div class="timebox">
        <h1 id="clockline">00:00:00</h1>
        <p class="sub"><b id="daylabel">День не начат</b><span id="pace" class="pace">час за 30 с</span></p>
      </div>
    </section>
    <section class="isle isle-status" aria-label="Состояние">
      <p class="viewers" id="viewers" title="Сколько вкладок смотрят эту симуляцию"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5C6.5 5 2.5 9.2 1.5 12c1 2.800 5 7 10.500 7s9.500-4.200 10.500-7C21.500 9.200 17.500 5 12 5zm0 11a4 4 0 1 1 0-8 4 4 0 0 1 0 8zm0-6.200a2.200 2.200 0 1 0 0 4.400 2.200 2.200 0 0 0 0-4.400z" fill="currentColor"/></svg><b id="viewers-n">1</b></p>
      <p id="status" class="status" role="status">стоит</p>
      <button type="button" id="sound" class="icon" aria-pressed="false" title="Звук: колокольчик, касса">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9.5v5h3.5L12 18.5v-13L7.5 9.5z" fill="currentColor"/><path class="waves" d="M15.5 9a4 4 0 0 1 0 6M18 6.5a8 8 0 0 1 0 11" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button type="button" id="open-settings" class="icon" title="Модель и прогон">
        <i id="llm-dot" class="dot"></i>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 8.800a3.200 3.200 0 1 0 0 6.400 3.200 3.200 0 0 0 0-6.400zM19.400 13.200a7.600 7.600 0 0 0 0-2.400l2-1.500-2-3.500-2.300.9a7.500 7.500 0 0 0-2.100-1.200L14.700 3h-4l-.3 2.500a7.500 7.500 0 0 0-2.100 1.200l-2.300-.9-2 3.500 2 1.500a7.600 7.600 0 0 0 0 2.400l-2 1.500 2 3.500 2.300-.9c.6.500 1.300.9 2.100 1.200l.3 2.500h4l.3-2.500c.8-.3 1.500-.7 2.100-1.200l2.300.9 2-3.500z" fill="none" stroke="currentColor" stroke-width="1.600" stroke-linejoin="round"/></svg>
      </button>
    </section>
  </header>
  <p id="banner" class="banner" hidden></p>
  <p id="link" class="banner" role="alert" hidden>Нет связи с сервером. Страница переподключится сама.</p>
  <footer class="deck">
    <nav class="transport" aria-label="Управление временем">
      <button type="button" id="auto" class="cmd primary" title="Пустить время: дни идут сами (пробел)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 4.5v15l12-7.5z" fill="currentColor"/></svg>
        <span>Пустить время</span>
      </button>
      <button type="button" id="pause" class="cmd" title="Заморозить часы (пробел)">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z" fill="currentColor"/></svg>
        <span>Пауза</span>
      </button>
      <button type="button" id="day" class="cmd" title="Доиграть день и встать в полночь">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z" fill="currentColor"/></svg>
        <span>До конца суток</span>
      </button>
    </nav>
    <div class="loom" id="loom" aria-label="Сутки: нити визитов по заведениям"></div>
  </footer>
  <div class="play">
    <div class="world" id="world">
      <div id="room" role="img" aria-label="Изометрический мир кофейни"></div>
      <div id="actor-access" class="actor-access-list" aria-label="Гости в зале"></div>
      <div class="camctl" id="camctl" role="group" aria-label="Камера и слои">
        <button type="button" id="cam-home" title="К кофейне (0, двойной клик)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11.5 12 5l8 6.5M6.5 10v9h11v-9M10 19v-5h4v5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
        <button type="button" id="cam-in" title="Приблизить (+, колесо мыши)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        <button type="button" id="cam-out" title="Отдалить (−)"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 12h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg></button>
        <button type="button" id="cam-traffic" title="К перекрёстку" aria-label="К перекрёстку"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="2" width="10" height="17" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><circle cx="12" cy="6" r="1.6" fill="#d9604c"/><circle cx="12" cy="10.5" r="1.6" fill="#e3b13c"/><circle cx="12" cy="15" r="1.6" fill="#3b9c69"/><path d="M12 19v3" stroke="currentColor" stroke-width="1.7"/></svg></button>
        <span class="sep"></span>
        <label class="chip" title="Имена и настроение над людьми"><input type="checkbox" id="lay-names" checked><span>Имена</span></label>
        <label class="chip" title="Прохожие и машины на улице"><input type="checkbox" id="lay-life" checked><span>Улица</span></label>
      </div>
      <div id="float" class="layer"></div>
      <div id="pops" class="layer"></div>
      <div class="leftstack">
        <section id="eventbar" class="eventbar" hidden></section>
      </div>
      <div id="signs" class="layer"></div>
      <aside id="inspect" class="inspect" hidden></aside>
      <section id="placecard" class="drawer left" hidden aria-label="Заведение">
        <div class="drawer-head"><h2 id="pc-name"></h2><button type="button" id="close-place">Закрыть</button></div>
        <p class="pc-meta" id="pc-meta"></p>
        <div class="tabs" id="pc-tabs" role="tablist"></div>
        <div class="pc-pane" data-pane="menu"><aside id="board" class="plaque" aria-label="Доска меню"></aside></div>
        <div class="pc-pane" data-pane="ribbon" hidden><ol id="ribbon-list" class="pc-list"></ol></div>
        <div class="pc-pane" data-pane="reviews" id="reviews" hidden></div>
        <div class="pc-pane" data-pane="notes" id="manager" hidden></div>
        <div class="pc-pane" data-pane="info" id="pc-info" hidden></div>
      </section>
      <section id="daycard" class="daycard" hidden></section>

      <section id="chats" class="drawer" hidden></section>
    </div>
  </div>
  <dialog id="settings-dlg" class="sheet" aria-labelledby="settings-title">
    <form id="settings" class="settings" method="dialog">
      <header class="sheet-head">
        <h2 id="settings-title">Модель и прогон</h2>
        <button type="button" class="x" id="close-settings" aria-label="Закрыть">×</button>
      </header>
      <p class="health" id="llm-brief"></p>
      <label>Адрес
        <input id="llm-url" name="base_url" autocomplete="off" autofocus>
      </label>
      <div class="pair">
        <label>Модель
          <input id="llm-model" name="model" autocomplete="off">
        </label>
        <label>Таймаут, с
          <input id="llm-timeout" name="timeout" type="number" min="5" max="180">
        </label>
      </div>
      <label>Ключ API (пусто — не менять)
        <input id="llm-key" name="api_key" type="password" autocomplete="new-password" placeholder="не задан">
      </label>
      <div class="pair">
        <label>Критик: адрес
          <input id="critic-url" name="critic_base_url" autocomplete="off" placeholder="как у основной">
        </label>
        <label>Критик: модель
          <input id="critic-model" name="critic_model" autocomplete="off" placeholder="как у основной">
        </label>
      </div>
      <footer class="sheet-foot">
        <button type="button" id="reset" class="danger">Начать заново</button>
        <button type="submit" class="save">Сохранить</button>
      </footer>
    </form>
  </dialog>
  <script src="/static/vendor/phaser-3.90.0.min.js"></script>

  <script src="/static/art/buildings/list.js"></script>

  <script src="/static/art/people/legs.js"></script>

  <script src="/static/art/vehicles/kinds.js"></script>
  <script src="/static/art/vehicles/model.js"></script>

  <script src="/static/art/rooms/cafe/floor.js"></script>

  <script src="/static/traffic.js"></script>
  <script src="/static/phaser-world.js"></script>
</body>
