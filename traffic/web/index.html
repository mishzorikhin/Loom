<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Транспортный полигон</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='10' y='2' width='12' height='28' rx='4' fill='%231b1f27'/%3E%3Ccircle cx='16' cy='9' r='3.4' fill='%23ff4848'/%3E%3Ccircle cx='16' cy='16' r='3.4' fill='%23ffb21e'/%3E%3Ccircle cx='16' cy='23' r='3.4' fill='%232bff88'/%3E%3C/svg%3E" />
  </head>
  <body>
    <div id="world"></div>
    <div id="vignette"></div>

    <header id="top" class="glass">
      <div class="brand">
        <span class="brand-mark"><i></i><i></i><i></i></span>
        <span class="brand-name">Полигон</span>
        <span class="brand-sub">светофоры · машины · пешеходы</span>
      </div>
      <nav id="worlds" class="chips"></nav>
      <div class="clock-wrap">
        <span id="sun" class="sun"></span>
        <span id="clock" class="clock">--:--</span>
        <span id="eff" class="eff"></span>
      </div>
      <button id="play" class="icon-btn" title="Пауза / пуск (пробел)"></button>
      <div id="speeds" class="seg"></div>
      <button id="panels" class="btn small" title="Скрыть или показать панели (P)">панели</button>
      <span id="conn" class="conn" title="Связь с сервером"></span>
    </header>

    <aside id="left" class="glass panel">
      <h3 id="left-head" class="fold">Управление светофорами <span class="chev">▾</span></h3>
      <div class="panel-body">
      <div id="controllers" class="seg seg-wide"></div>
      <p id="ctl-hint" class="hint"></p>
      <label class="slider">
        <span>Поток машин <b id="demand-v"></b></span>
        <input id="demand" type="range" min="0" max="3" step="0.05" />
      </label>
      <label class="slider">
        <span>Пешеходы <b id="peds-v"></b></span>
        <input id="peds" type="range" min="0" max="3" step="0.05" />
      </label>
      <label class="slider danger">
        <span>Запас переходных стадий <b id="timing-v"></b></span>
        <input id="timing" type="range" min="0" max="1.5" step="0.05" />
        <small id="timing-hint">Жёлтый, весь красный и мигающий зелёный в долях от безопасных по геометрии</small>
      </label>
      <label class="toggle">
        <input id="block-box" type="checkbox" />
        <span>Не въезжать на занятый перекрёсток</span>
      </label>
      <div class="row">
        <label class="seed">Зерно <input id="seed" type="number" min="0" step="1" /></label>
        <button id="reset" class="btn">Сбросить прогон</button>
      </div>
      </div>
    </aside>

    <aside id="right" class="glass panel">
      <h3>Сводка <span id="sim-time" class="muted"></span></h3>
      <div class="kpis">
        <div class="kpi"><b id="k-cars">0</b><span>в сети</span></div>
        <div class="kpi"><b id="k-done">0</b><span>доехали</span></div>
        <div class="kpi"><b id="k-delay">0</b><span>задержка, с</span></div>
        <div class="kpi"><b id="k-peds">0</b><span>пешеходов</span></div>
        <div class="kpi bad"><b id="k-crash">0</b><span>ДТП</span></div>
        <div class="kpi warn"><b id="k-near">0</b><span>сближений</span></div>
      </div>
      <canvas id="spark" width="560" height="150"></canvas>
      <div class="legend-row">
        <span><i class="sw" style="background: var(--accent)"></i>доехали / мин</span>
        <span><i class="sw" style="background: var(--amber)"></i>задержка</span>
        <span><i class="sw" style="background: var(--red)"></i>ДТП</span>
      </div>
      <div id="causes" class="causes"></div>
      <div id="violations" class="muted small"></div>
    </aside>

    <section id="feed" class="glass panel">
      <h3>События</h3>
      <ul id="events"></ul>
    </section>

    <section id="inspect" class="glass panel hidden"></section>

    <footer id="bottom" class="glass">
      <div class="seg" id="views">
        <button data-view="3d" title="Обзор (1)">Обзор</button>
        <button data-view="top" title="Сверху (2)">Сверху</button>
        <button data-view="low" title="Низко (3)">Низко</button>
      </div>
      <div class="layers" id="layers">
        <button data-layer="strips" class="on" title="Состояние сигнала на каждом движении (S)">Сигналы</button>
        <button data-layer="conflicts" title="Точки конфликтов (C)">Конфликты</button>
        <button data-layer="heat" title="Тепловая карта ДТП и сближений (H)">Тепло</button>
        <button data-layer="mini" title="Эффект миниатюры (M)">Миниатюра</button>
      </div>
      <div class="hour">
        <span>Время суток</span>
        <input id="hour" type="range" min="0" max="24" step="0.25" title="Только для картинки; часы симуляции не меняются" />
        <button id="hour-sync" class="btn small on" title="Свет по часам симуляции">по часам</button>
      </div>
    </footer>

    <div id="toast" class="toast hidden"></div>
    <div id="boot" class="boot"><div class="boot-mark"><i></i><i></i><i></i></div><p>Подключение к симуляции…</p></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
